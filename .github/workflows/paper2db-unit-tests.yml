# Standalone paper2db unit tests for the dse-items stage and the answer-pointer
# join it consumes. These modules build their own temp-tree fixtures, so no
# PDFs, crops or other generated data are required. One job per test module,
# so a failure names the test that broke.
name: paper2db-unit-tests

on:
  pull_request:
    paths:
      - "paper2db/**"
      - ".github/workflows/paper2db-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "paper2db/**"
      - ".github/workflows/paper2db-unit-tests.yml"

jobs:
  dse-items-unit-tests:
    name: dse-items-unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install-pillow
        run: python3 -m pip install "Pillow>=10,<12"
      # Unit tests for the dse-items stage. They cover record joining, schema
      # validation, and image gating on temp-tree fixtures, with no PDFs or
      # crops required.
      # Breaking them costs published crops for a question the source papers
      # do not hold, or a section that silently loses its records.
      - name: run-dse-items-unit-tests
        run: python3 -m unittest tests.test_dse_items

  pointers-unit-tests:
    name: pointers-unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests for the answer-pointer store this stage joins against.
      # Breaking them costs a crop or page pointer that resolves to the wrong
      # question, or a conflicting pointer passing merge.
      - name: run-answer-pointer-unit-tests
        run: python3 -m unittest tests.test_pointers
