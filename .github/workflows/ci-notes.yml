name: ci-notes
on:
  pull_request:
    paths:
      - "paper2notes/notes/**"
      - "paper2notes/scripts/**"
      - "paper2notes/.github/workflows/**"
      - ".github/workflows/ci-notes.yml"
  push:
    branches: [main]
    paths:
      - "paper2notes/notes/**"
      - "paper2notes/scripts/**"
      - "paper2notes/.github/workflows/**"
      - ".github/workflows/ci-notes.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node paper2notes/scripts/ci-check.mjs
