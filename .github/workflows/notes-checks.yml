name: notes-checks

on:
  pull_request:
    paths:
      - "paper2notes/notes/**"
      - "paper2notes/scripts/**"
      - "paper2notes/tests/**"
      - "paper2db/scripts/leak_fingerprints.py"
      - "paper2db/qb-web-ui-staging/**/*.json"
      - "paper2notes/anchors/**"
      - "paper2db/metadata/pointers/**"
      - "paper2db/metadata/lq/llm_classifications.json"
      - "paper2db/metadata/mc/llm_classifications.json"
      - "paper2db/tests/reconstructed/lq/**"
      - "paper2notes/.github/workflows/**"
      - ".github/workflows/notes-checks.yml"
  push:
    branches: [main]
    paths:
      - "paper2notes/notes/**"
      - "paper2notes/scripts/**"
      - "paper2notes/tests/**"
      - "paper2db/scripts/leak_fingerprints.py"
      - "paper2db/qb-web-ui-staging/**/*.json"
      - "paper2notes/anchors/**"
      - "paper2db/metadata/pointers/**"
      - "paper2db/metadata/lq/llm_classifications.json"
      - "paper2db/metadata/mc/llm_classifications.json"
      - "paper2db/tests/reconstructed/lq/**"
      - "paper2notes/.github/workflows/**"
      - ".github/workflows/notes-checks.yml"

# One job per distinct check, so a failure names the test that broke.
# Triggers and path filters stay defined once per workflow; separate
# workflow files would only duplicate them.
jobs:
  anchor-lint-tests:
    name: anchor-lint tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test paper2notes/tests/anchor-lint.test.mjs

  ci-check:
    name: ci-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node paper2notes/scripts/ci-check.mjs

  leak-check-tests:
    name: leak-check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test paper2notes/tests/leak-check.test.mjs

  dse-availability-tests:
    name: dse-availability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test paper2notes/tests/dse-availability.test.mjs

  quiz-audit-tests:
    name: quiz-audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test paper2notes/tests/quiz-audit.test.mjs

  quiz-store-audit-tests:
    name: quiz-store-audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test paper2notes/tests/quiz-store-audit.test.mjs

  quiz-audit:
    name: quiz audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node paper2notes/scripts/quiz-audit.mjs

  leak-fingerprint-check:
    name: leak fingerprint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 paper2db/scripts/leak_fingerprints.py --check
