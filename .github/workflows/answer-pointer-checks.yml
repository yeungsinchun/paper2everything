# Checks answer-pointer shape, coverage, and unit behavior when pointer data, its
# schema, tooling, or related QB staging files change. Failures protect stored
# answers from invalid or incomplete references.
# One job per distinct answer-pointer check, so a failure names the test
# that broke. Triggers and path filters stay defined once per workflow.
name: answer-pointer-checks

on:
  pull_request:
    paths:
      - "paper2db/metadata/pointers/**"
      - "paper2db/schemas/answer-pointer.v1.json"
      - "paper2db/scripts/pointers.py"
      - "paper2db/tests/test_pointers.py"
      - "paper2db/qb-web-ui-staging/**"
      - "paper2db/metadata/qb/banks.json"
      - ".github/workflows/answer-pointer-checks.yml"
  push:
    branches: [main]
    paths:
      - "paper2db/metadata/pointers/**"
      - "paper2db/schemas/answer-pointer.v1.json"
      - "paper2db/scripts/pointers.py"
      - "paper2db/tests/test_pointers.py"
      - "paper2db/qb-web-ui-staging/**"
      - "paper2db/metadata/qb/banks.json"
      - ".github/workflows/answer-pointer-checks.yml"

jobs:
  pointers-check:
    name: pointers-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Resolves every stored answer pointer against the item universes.
      # A malformed pointer, two conflicting targets at the same tier, or a
      # target that is missing on disk fails here.
      - name: check-answer-pointer-store
        run: python3 scripts/pointers.py check

  pointers-coverage:
    name: pointers-coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Prints how many items each corpus resolves per tier, so a work-in-
      # progress pointer store stays visible in the run log.
      - name: report-answer-pointer-coverage
        run: python3 scripts/pointers.py coverage

  pointers-unit-tests:
    name: pointers-unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Unit tests for the pointer store: schema validation, tier merge with
      # conflicts, the item join, coverage counting, and the CI resolver.
      # Breaking them costs a pointer store that resolves to the wrong crop or
      # silently drops an item.
      - name: run-answer-pointer-unit-tests
        run: python3 -m unittest tests.test_pointers
