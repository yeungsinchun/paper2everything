<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>body{padding:20px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:56px;border-radius:12px;border:2px solid rgba(0,0,0,.05)}.sw b{font:700 12px/1.2 var(--font-body)}.sw code{font:500 11px/1.2 var(--font-mono);color:var(--ink-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--teal-50)"></i><b>50</b><code>--teal-50</code></div><div class="sw"><i style="background:var(--teal-100)"></i><b>100</b><code>--teal-100</code></div><div class="sw"><i style="background:var(--teal-300)"></i><b>300</b><code>--teal-300</code></div><div class="sw"><i style="background:var(--teal-500)"></i><b>500</b><code>--teal-500</code></div><div class="sw"><i style="background:var(--teal-600)"></i><b>600 · brand</b><code>--teal-600</code></div><div class="sw"><i style="background:var(--teal-700)"></i><b>700</b><code>--teal-700</code></div><div class="sw"><i style="background:var(--teal-900)"></i><b>900 · edge</b><code>--teal-900</code></div></div></body></html>
