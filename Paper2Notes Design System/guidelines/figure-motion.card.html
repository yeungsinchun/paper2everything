<!-- @dsCard group="Figures" viewport="700x170" name="Animation rhythm" subtitle="1.4s per scene · 0.4s steps · ease-out · replay, never loop" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}code{font:500 11px var(--font-mono);color:var(--ink-3)}</style></head><body><div style="display:grid;gap:10px"><div style="display:flex;align-items:center;gap:12px"><code style="width:44px">0s</code><div style="height:10px;border-radius:99px;background:var(--teal-300);width:22%"></div><span style="font:600 13px var(--font-body);color:var(--ink-2)">1 · draw object</span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:44px">0.4s</code><div style="height:10px;border-radius:99px;background:var(--teal-500);width:44%"></div><span style="font:600 13px var(--font-body);color:var(--ink-2)">2 · grow vector</span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:44px">0.8s</code><div style="height:10px;border-radius:99px;background:var(--teal-600);width:66%"></div><span style="font:600 13px var(--font-body);color:var(--ink-2)">3 · label appears</span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:44px">1.4s</code><div style="height:10px;border-radius:99px;background:var(--teal-700);width:88%"></div><span style="font:600 13px var(--font-body);color:var(--ink-2)">4 · hold, show Replay</span></div></div></body></html>
