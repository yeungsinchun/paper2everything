<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>body{padding:20px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:56px;border-radius:12px;border:2px solid rgba(0,0,0,.05)}.sw b{font:700 12px/1.2 var(--font-body)}.sw code{font:500 11px/1.2 var(--font-mono);color:var(--ink-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--paper)"></i><b>paper · page</b><code>--paper</code></div><div class="sw"><i style="background:var(--card)"></i><b>card</b><code>--card</code></div><div class="sw"><i style="background:var(--line-soft)"></i><b>line-soft</b><code>--line-soft</code></div><div class="sw"><i style="background:var(--line)"></i><b>line</b><code>--line</code></div><div class="sw"><i style="background:var(--ink-3)"></i><b>ink-3</b><code>--ink-3</code></div><div class="sw"><i style="background:var(--ink-2)"></i><b>ink-2</b><code>--ink-2</code></div><div class="sw"><i style="background:var(--ink)"></i><b>ink</b><code>--ink</code></div></div></body></html>
