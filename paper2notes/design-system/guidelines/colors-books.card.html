<!-- @dsCard group="Colors" viewport="700x150" name="Book tones" subtitle="One hue per book; ring + icon tint only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>body{padding:20px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:56px;border-radius:12px;border:2px solid rgba(0,0,0,.05)}.sw b{font:700 12px/1.2 var(--font-body)}.sw code{font:500 11px/1.2 var(--font-mono);color:var(--ink-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--book2)"></i><b>Book 2</b><code>--book2</code></div><div class="sw"><i style="background:var(--book4)"></i><b>Book 4</b><code>--book4</code></div><div class="sw"><i style="background:var(--book5)"></i><b>Book 5</b><code>--book5</code></div><div class="sw"><i style="background:var(--bookqb)"></i><b>QB</b><code>--bookqb</code></div><div class="sw"><i style="background:var(--tier-bronze)"></i><b>bronze</b><code>--tier-bronze</code></div><div class="sw"><i style="background:var(--tier-silver)"></i><b>silver</b><code>--tier-silver</code></div><div class="sw"><i style="background:var(--tier-gold)"></i><b>gold</b><code>--tier-gold</code></div></div></body></html>
