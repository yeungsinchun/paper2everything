<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../css/p2n-shell.css">
<link rel="stylesheet" href="css/qb.css">
</head>
<body>
<header class="p2n-top">
  <a class="p2n-top-brand" href="../index.html">paper<i>2</i>notes</a>
  <nav class="p2n-top-nav" aria-label="Books">
    <a href="../book2/index.html">Book 2</a>
    <a href="../book4/index.html">Book 4</a>
    <a href="../book5/index.html">Book 5</a>
    <a href="index.html" aria-current="page">QB</a>
    <a href="../mock/index.html">Mock</a>
  </nav>
</header>

<main class="p2n-page qb-page">
  <div class="qb-head">
    <span class="p2n-label">Practice</span>
    <h1>Question bank</h1>
  </div>

  <nav class="qb-tabs" aria-label="Sections">
    <a href="#dse">Past papers</a>
    <a href="#qb">Book 5 QB</a>
  </nav>

  <div class="qb-sel" id="selection-summary" aria-live="polite">
    <span class="qb-sel-n" id="sel-count">0 selected</span>
    <span class="qb-sel-split" id="sel-split"></span>
    <div class="qb-sel-act">
      <button type="button" class="qb-btn" id="clear-selection">Clear</button>
      <button type="button" class="qb-btn qb-btn--primary" id="export-selection">Copy IDs</button>
    </div>
  </div>

  <section id="dse" class="qb-store">
    <div class="qb-store-head">
      <h2>Past papers</h2>
      <span class="qb-count" id="dse-count"></span>
    </div>
    <div class="qb-filters" role="search" aria-label="Past paper filters">
      <div class="qb-field"><label class="p2n-label" for="dse-topic">Topic</label>
        <select id="dse-topic"><option value="">All topics</option></select></div>
      <div class="qb-field"><label class="p2n-label" for="dse-type">Type</label>
        <select id="dse-type"><option value="">All</option><option value="mc">MC</option><option value="lq">LQ</option></select></div>
      <div class="qb-field qb-field--grow"><label class="p2n-label" for="dse-search">Search</label>
        <input id="dse-search" type="search" placeholder="2018 31 fission"></div>
    </div>
    <div class="qb-chips" id="dse-topic-counts" aria-label="Topics"></div>
    <div class="qb-grid" id="dse-grid" aria-live="polite"></div>
  </section>

  <section id="qb" class="qb-store">
    <div class="qb-store-head">
      <h2>Book 5 QB</h2>
      <span class="qb-count" id="qb-count"></span>
    </div>
    <div class="qb-filters" role="search" aria-label="QB filters">
      <div class="qb-field"><label class="p2n-label" for="qb-topic">Chapter</label>
        <select id="qb-topic"><option value="">All chapters</option></select></div>
      <div class="qb-field"><label class="p2n-label" for="qb-type">Type</label>
        <select id="qb-type"><option value="">All</option><option value="mc">MC</option><option value="sq">SQ</option><option value="lq">LQ</option><option value="rq">RQ</option></select></div>
      <div class="qb-field qb-field--grow"><label class="p2n-label" for="qb-search">Search</label>
        <input id="qb-search" type="search" placeholder="PHY15031101 or fission"></div>
    </div>
    <div class="qb-chips" id="qb-topic-counts" aria-label="Chapters"></div>
    <div class="qb-grid" id="qb-grid" aria-live="polite"></div>
  </section>
</main>

<script>
// Two separate stores, never merged: DSE past papers and QB.
const STORES = { dse_mc: null, dse_lq: null, dse_sections: null, qb_items: null, qb_banks: null, qb_deployed: null };
let selected = new Set(); // ids like "dse:2018-31" and "qb:PHY15031101"

function fetchJSON(path) {
  return fetch(path).then(r => { if(!r.ok) throw new Error(path+": "+r.status); return r.json(); });
}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function init() {
  Promise.all([
    fetchJSON("data/dse_mc.json"),
    fetchJSON("data/dse_lq.json"),
    fetchJSON("data/dse_sections.json"),
    fetchJSON("data/qb_book5.json"),
    fetchJSON("data/qb_banks.json"),
    fetchJSON("data/qb_deployed.json").catch(()=>null),
  ]).then(([mc, lq, sec, qbBook5, qbBanks, qbDeployed]) => {
    STORES.dse_mc = mc; STORES.dse_lq = lq; STORES.dse_sections = sec;
    STORES.qb_items = qbBook5; STORES.qb_banks = qbBanks; STORES.qb_deployed = qbDeployed;
    setupDSE();
    setupQB();
    updateSelectionUI();
  }).catch(err => {
    $("dse-count").textContent = "Couldn't load. Try again.";
    console.error(err);
  });
}

function sectionLabel(n) {
  const sec = STORES.dse_sections.sections.find(s => s.number===n);
  return sec ? sec.name : `§${n}`;
}

function tag(text, kind) { return `<span class="qb-tag${kind ? " qb-tag--"+kind : ""}">${esc(text)}</span>`; }

function figure(src, alt) {
  if (!src) return `<div class="qb-fig"><div class="qb-fig-miss">Crop coming soon</div></div>`;
  return `<div class="qb-fig"><img data-src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></div>`;
}

function pick(id, isSel) {
  return `<label class="qb-pick"><input type="checkbox" ${isSel?"checked":""} data-id="${esc(id)}"> Select</label>`;
}

function wirePicks(grid) {
  grid.querySelectorAll("img[data-src]").forEach(img=>{ img.src = img.dataset.src; });
  grid.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.addEventListener("change", e=>{
      const id = e.target.dataset.id;
      if (e.target.checked) selected.add(id); else selected.delete(id);
      updateSelectionUI();
    });
  });
}

function setPressed(box, btn) {
  [...box.children].forEach(c=>c.setAttribute("aria-pressed","false"));
  btn.setAttribute("aria-pressed","true");
}

function setupDSE() {
  const all = [...STORES.dse_mc.items, ...STORES.dse_lq.items];
  const secStats = STORES.dse_sections.stats;
  const sel = $("dse-topic");
  const chipBox = $("dse-topic-counts");
  secStats.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.number;
    opt.textContent = `${String(s.number).padStart(2,"0")} ${s.name} (${s.total})`;
    sel.appendChild(opt);
    if (s.total===0) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "qb-chip"; b.setAttribute("aria-pressed","false");
    b.dataset.section = s.number;
    b.innerHTML = `${esc(s.name)} <small>${s.total}</small>`;
    b.addEventListener("click", () => { sel.value = b.dataset.section; applyDSEFilter(); setPressed(chipBox, b); });
    chipBox.appendChild(b);
  });
  const allBtn = document.createElement("button");
  allBtn.type="button"; allBtn.className="qb-chip"; allBtn.setAttribute("aria-pressed","true");
  allBtn.textContent="All";
  allBtn.addEventListener("click",()=>{ sel.value=""; $("dse-search").value=""; $("dse-type").value=""; applyDSEFilter(); setPressed(chipBox, allBtn); });
  chipBox.prepend(allBtn);
  sel.addEventListener("change", ()=>{ applyDSEFilter(); setPressed(chipBox, [...chipBox.children].find(c=>c.dataset.section===sel.value) || allBtn); });
  $("dse-type").addEventListener("change", applyDSEFilter);
  $("dse-search").addEventListener("input", applyDSEFilter);
  window._dseAll = all;
  applyDSEFilter();
}

function applyDSEFilter() {
  const topic = $("dse-topic").value;
  const type = $("dse-type").value;
  const q = $("dse-search").value.trim().toLowerCase();
  let items = window._dseAll || [];
  if (topic) items = items.filter(it => it.sections.includes(Number(topic)));
  if (type) items = items.filter(it => it.type===type);
  if (q) {
    const terms = q.split(/\s+/);
    items = items.filter(it => {
      const hay = `${it.id} ${it.year} ${it.question} ${it.type} ${it.sectionNames.join(" ")} ${it.reason} ${it.statementPreview||""} ${it.performance||""}`.toLowerCase();
      return terms.every(t=> hay.includes(t));
    });
  }
  items = [...items].sort((a,b)=>{
    const ya = a.year==="pp"? 9997 : a.year==="sap"? 9998 : Number(a.year);
    const yb = b.year==="pp"? 9997 : b.year==="sap"? 9998 : Number(b.year);
    if (ya!==yb) return ya-yb;
    return a.question-b.question;
  });
  $("dse-count").textContent = `${items.length} / ${window._dseAll.length}`;
  renderDSE(items);
}

function renderDSE(items) {
  const grid = $("dse-grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  items.slice(0, 400).forEach(it => { // cap for performance
    const card = document.createElement("article");
    card.className = "qb-card";
    const id = `dse:${it.id}`;
    const ans = it.answer || {};
    const chips = [tag(it.type.toUpperCase())];
    if (it.type==="mc") {
      if (ans.deleted) chips.push(tag("Deleted"));
      else if (ans.correctOption) chips.push(tag(ans.percentage!=null ? `${ans.correctOption} · ${ans.percentage}%` : ans.correctOption, "ok"));
    }
    if (it.marks) chips.push(tag(`${it.marks} m`, "sun"));
    const topic = it.sections.length ? it.sections.map(sectionLabel).join(" + ") : "Unsorted";
    card.innerHTML = `
      <div class="qb-card-head">
        <span class="qb-card-id">${esc(it.year.toUpperCase())} Q${esc(it.question)}</span>
        <span class="qb-card-chips">${chips.join("")}</span>
      </div>
      ${figure(it.hasCrop && it.image, `${it.id} ${it.type} question`)}
      <div class="qb-card-foot">
        <span class="qb-topic" title="${esc(topic)}">${esc(topic)}</span>
        ${pick(id, selected.has(id))}
      </div>`;
    frag.appendChild(card);
  });
  if (items.length>400) {
    const more = document.createElement("div");
    more.className = "qb-empty";
    more.textContent = `${items.length-400} more. Narrow the filter.`;
    frag.appendChild(more);
  }
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "qb-empty";
    empty.textContent = "Nothing here. Try another filter.";
    frag.appendChild(empty);
  }
  grid.appendChild(frag);
  wirePicks(grid);
}

function setupQB() {
  const banks = STORES.qb_banks.banks;
  const deployedBanks = (STORES.qb_deployed && STORES.qb_deployed.deployed.banks) || ["QB_501","QB_502","QB_503"];
  const sel = $("qb-topic");
  const chipBox = $("qb-topic-counts");
  banks.filter(b => deployedBanks.includes(b.bank)).forEach(b=>{
    const name = b.sectionName || b.bank;
    const opt = document.createElement("option");
    opt.value = b.bank;
    opt.textContent = `${name} (${b.expectedItems})`;
    sel.appendChild(opt);
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "qb-chip"; btn.setAttribute("aria-pressed","false");
    btn.dataset.bank = b.bank;
    btn.innerHTML = `${esc(name)} <small>${b.expectedItems}</small>`;
    btn.addEventListener("click",()=>{ sel.value=b.bank; applyQBFilter(); setPressed(chipBox, btn); });
    chipBox.appendChild(btn);
  });
  const allBtn = document.createElement("button");
  allBtn.type="button"; allBtn.className="qb-chip"; allBtn.setAttribute("aria-pressed","true");
  allBtn.textContent="All";
  allBtn.addEventListener("click",()=>{ sel.value=""; $("qb-search").value=""; $("qb-type").value=""; applyQBFilter(); setPressed(chipBox, allBtn); });
  chipBox.prepend(allBtn);
  sel.addEventListener("change", ()=>{ applyQBFilter(); setPressed(chipBox, [...chipBox.children].find(c=>c.dataset.bank===sel.value) || allBtn); });
  $("qb-type").addEventListener("change", applyQBFilter);
  $("qb-search").addEventListener("input", applyQBFilter);
  window._qbAll = STORES.qb_items.items;
  applyQBFilter();
}

function applyQBFilter(){
  const bank = $("qb-topic").value;
  const type = $("qb-type").value;
  const q = $("qb-search").value.trim().toLowerCase();
  let items = window._qbAll || [];
  if (bank) items = items.filter(it=> it.bank===bank);
  if (type) items = items.filter(it=> it.type===type);
  if (q) {
    const terms = q.split(/\s+/);
    items = items.filter(it=>{
      const hay = `${it.id} ${it.bank} ${it.type} ${it.level} ${it.part} ${it.stem.text||""}`.toLowerCase();
      return terms.every(t=> hay.includes(t));
    });
  }
  items = [...items].sort((a,b)=> a.id.localeCompare(b.id));
  $("qb-count").textContent = `${items.length} / ${window._qbAll.length}`;
  renderQB(items);
}

function renderQB(items){
  const grid = $("qb-grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  const bankName = b => (STORES.qb_banks.banks.find(x=>x.bank===b)||{}).sectionName || "";
  items.slice(0,300).forEach(it=>{
    const id = `qb:${it.id}`;
    const levelTag = it.level==="dif" ? tag("Hard","sun") : it.level==="easy" ? tag("Easy","ok") : tag(it.level);
    const chips = [tag(it.type.toUpperCase()), levelTag, tag(`${it.marks} m`, "sun")];
    const img = it.images && it.images.stem && it.images.stem[0];
    const card = document.createElement("article");
    card.className = "qb-card";
    card.innerHTML = `
      <div class="qb-card-head">
        <span class="qb-card-id">${esc(it.id)}</span>
        <span class="qb-card-chips">${chips.join("")}</span>
      </div>
      ${figure(img, `${it.id} question`)}
      <div class="qb-card-foot">
        <span class="qb-topic">Ch.${esc(it.chapter)} ${esc(bankName(it.bank))}</span>
        ${pick(id, selected.has(id))}
      </div>`;
    frag.appendChild(card);
  });
  if (items.length>300) {
    const more = document.createElement("div");
    more.className = "qb-empty";
    more.textContent = `${items.length-300} more. Narrow the filter.`;
    frag.appendChild(more);
  }
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "qb-empty";
    empty.textContent = "Nothing here. Try another filter.";
    frag.appendChild(empty);
  }
  grid.appendChild(frag);
  wirePicks(grid);
}

function updateSelectionUI(){
  const arr = [...selected];
  const dse = arr.filter(id=>id.startsWith("dse:")).length;
  const qb = arr.filter(id=>id.startsWith("qb:")).length;
  $("sel-count").textContent = `${arr.length} selected`;
  $("sel-split").textContent = arr.length ? `DSE ${dse} · QB ${qb}` : "";
}

$("clear-selection").addEventListener("click", ()=>{ selected.clear(); document.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.checked=false); updateSelectionUI(); });
$("export-selection").addEventListener("click", ()=>{
  if (!selected.size) return;
  const txt = [...selected].join("\n");
  navigator.clipboard.writeText(txt).then(()=>{ const b=$("export-selection"); b.textContent="Copied"; setTimeout(()=>{ b.textContent="Copy IDs"; }, 1600); }, ()=> prompt("Copy:",txt));
});

init();
</script>
