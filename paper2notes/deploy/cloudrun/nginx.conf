# nginx server block for the paper2notes container (Cloud Run sends traffic
# to $PORT, which is 8080 for this service).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS and proxies plain HTTP to this container on
    # 8080; without this, nginx's implicit directory redirect for a book
    # path with no trailing slash builds an absolute Location using that
    # internal scheme/port, e.g. http://host:8080/book5/, which is
    # unreachable from outside. A relative Location resolves against the
    # original request.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Landing page at / lists every book (Book 2, 4, 5). No redirect.
    # Vendored libraries never change in place (all books).
    location ~ ^/(book2|book4|book5)/(vendor|.*/js/lib)/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
