<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>body{padding:20px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:56px;border-radius:12px;border:2px solid rgba(0,0,0,.05)}.sw b{font:700 12px/1.2 var(--font-body)}.sw code{font:500 11px/1.2 var(--font-mono);color:var(--ink-3)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--sun-100)"></i><b>sun 100</b><code>--sun-100</code></div><div class="sw"><i style="background:var(--sun-400)"></i><b>sun 400 · XP</b><code>--sun-400</code></div><div class="sw"><i style="background:var(--sun-500)"></i><b>sun 500</b><code>--sun-500</code></div><div class="sw"><i style="background:var(--sun-700)"></i><b>sun 700 · edge</b><code>--sun-700</code></div><div class="sw"><i style="background:var(--flame-100)"></i><b>flame 100</b><code>--flame-100</code></div><div class="sw"><i style="background:var(--flame-500)"></i><b>flame 500</b><code>--flame-500</code></div></div></body></html>
