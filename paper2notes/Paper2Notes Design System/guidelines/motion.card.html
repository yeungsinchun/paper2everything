<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>body{padding:20px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:56px;border-radius:12px;border:2px solid rgba(0,0,0,.05)}.sw b{font:700 12px/1.2 var(--font-body)}.sw code{font:500 11px/1.2 var(--font-mono);color:var(--ink-3)}.m:hover i{left:calc(100% - 24px)!important}</style></head><body><div style="display:grid;gap:10px"><div class="m" style="display:flex;align-items:center;gap:12px"><code style="width:80px;font:500 11px var(--font-mono);color:var(--ink-3)">ease-out</code><div style="flex:1;height:28px;background:var(--line-soft);border-radius:99px;position:relative"><i style="position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--teal-500);transition:left var(--dur) var(--ease-out)"></i></div><span style="width:180px;font-size:12px;font-weight:600;color:var(--ink-2)">240ms · open/close, fills</span></div><div class="m" style="display:flex;align-items:center;gap:12px"><code style="width:80px;font:500 11px var(--font-mono);color:var(--ink-3)">spring</code><div style="flex:1;height:28px;background:var(--line-soft);border-radius:99px;position:relative"><i style="position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--teal-500);transition:left var(--dur-slow) var(--ease-spring)"></i></div><span style="width:180px;font-size:12px;font-weight:600;color:var(--ink-2)">600ms · XP pop, toasts</span></div><div class="m" style="display:flex;align-items:center;gap:12px"><code style="width:80px;font:500 11px var(--font-mono);color:var(--ink-3)">fast</code><div style="flex:1;height:28px;background:var(--line-soft);border-radius:99px;position:relative"><i style="position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--teal-500);transition:left var(--dur-fast) var(--ease-out)"></i></div><span style="width:180px;font-size:12px;font-weight:600;color:var(--ink-2)">120ms · hover, press</span></div></div></body></html>
