<!-- @dsCard group="Spacing" viewport="700x170" name="Edges & shadows" subtitle="Pressables sit 3px proud; pop for floating" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>body{padding:20px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:56px;border-radius:12px;border:2px solid rgba(0,0,0,.05)}.sw b{font:700 12px/1.2 var(--font-body)}.sw code{font:500 11px/1.2 var(--font-mono);color:var(--ink-3)}</style></head><body><div class="row" style="gap:20px;align-items:center"><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><i style="display:block;width:96px;height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:var(--edge)"></i><code style="font:500 11px var(--font-mono);color:var(--ink-3)">edge</code></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><i style="display:block;width:96px;height:56px;border-radius:14px;background:var(--teal-600);border:2px solid transparent;box-shadow:var(--edge-brand)"></i><code style="font:500 11px var(--font-mono);color:var(--ink-3)">edge-brand</code></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><i style="display:block;width:96px;height:56px;border-radius:14px;background:var(--sun-400);border:2px solid transparent;box-shadow:var(--edge-sun)"></i><code style="font:500 11px var(--font-mono);color:var(--ink-3)">edge-sun</code></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><i style="display:block;width:96px;height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow-card)"></i><code style="font:500 11px var(--font-mono);color:var(--ink-3)">card</code></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><i style="display:block;width:96px;height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow-pop)"></i><code style="font:500 11px var(--font-mono);color:var(--ink-3)">pop</code></div></div></body></html>
